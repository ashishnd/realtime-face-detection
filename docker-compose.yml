services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: megaai
      POSTGRES_PASSWORD: megaai
      POSTGRES_DB: megaai
    ports:
      - "5432:5432"
    volumes:
      - megaai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megaai -d megaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://megaai:megaai@postgres:5432/megaai
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  megaai_pg:
